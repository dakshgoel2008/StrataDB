name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false  # keep running the other jobs if one fails
      matrix:
        compiler: [gcc, clang]
        preset: [release, asan]

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CXX=g++-14" >> "$GITHUB_ENV"
          else
            echo "CXX=clang++-18" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DSTRATA_WERROR=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Crash test (kill -9)
        if: matrix.preset == 'release'
        run: ./build/release/tools/crashtest --iterations 300 --dir crashtest-runs/db

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev

      - name: Build fuzzers
        run: |
          cmake --preset fuzz -DCMAKE_CXX_COMPILER=clang++-18 -DSTRATA_WERROR=ON
          cmake --build --preset fuzz --target wal_fuzz snapshot_fuzz make_seeds

      - name: Fuzz for 2 minutes each
        run: |
          ./build/fuzz/fuzz/make_seeds fuzz/corpus
          mkdir -p fuzz/artifacts
          ./build/fuzz/fuzz/wal_fuzz fuzz/corpus/wal -max_total_time=120 -artifact_prefix=fuzz/artifacts/
          ./build/fuzz/fuzz/snapshot_fuzz fuzz/corpus/snapshot -max_total_time=120 -artifact_prefix=fuzz/artifacts/
